spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/FREEPDB1
spring.datasource.username=tienda
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true

server.port=8080

app.jwt.expiracion-minutos=60
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8081}
spring.application.name=PharmaBackend
spring.profiles.default=local
spring.profiles.group.local=dev
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
# El esquema TIENDA ya existe; el arranque no modifica tablas ni usuarios.
spring.flyway.enabled=false


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
spring.cache.type=redis
spring.cache.cache-names=categorias,productos
spring.cache.redis.time-to-live=10m
spring.cache.redis.enable-statistics=true
spring.cache.redis.cache-null-values=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=PharmaBackend
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n
